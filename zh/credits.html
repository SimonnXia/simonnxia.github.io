<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型与素材说明 — 夏琛沣</title><style>body{margin:0;background:#eeeae1;color:#193b3a;font:17px/1.9 "PingFang SC","Microsoft YaHei",sans-serif}main{max-width:800px;padding:80px 30px;margin:auto}h1{font-size:40px;line-height:1.4}a{color:inherit;text-underline-offset:5px}p{margin:30px 0}</style></head><body><main><a href="/zh/#home">返回中文作品集</a><h1>模型与素材说明</h1><p>开场人物使用 <a href="https://github.com/mrdoob/three.js/blob/dev/examples/models/gltf/Xbot.glb">Three.js 的 Xbot 示例模型</a>，采用深绿色表面与米白色线框，跑步动画由页面滚动控制。</p><p>AxisPro 使用项目原始 CAD 装配。其他交互模型根据项目参考图重建，用于展示概念形态。各项目已分别注明原始图纸、团队成果及 AI 辅助效果图。</p><p>本网站同时提供中文与英文版本，作品集和简历可在页面中下载。</p><a href="/credits.html" lang="en">English credits ↗</a></main></body></html>
